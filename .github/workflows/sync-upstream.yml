name: Sync fork with upstream

# Keeps fzf/herdr master = herdrdev/herdr master + the fork's own commits.
# A merge conflict fails the job, which GitHub reports by email.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/herdrdev/herdr.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "already up to date with upstream"
            exit 0
          fi
          git merge --no-edit upstream/master
          git push origin HEAD:master
